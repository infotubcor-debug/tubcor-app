<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4A261"/>
      <stop offset="100%" stop-color="#E88A4B"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo blanco con esquinas redondeadas -->
  <rect width="512" height="512" rx="90" ry="90" fill="#FFFFFF"/>
  
  <!-- Isotipo hexagonal estilizado (centrado) -->
  <g transform="translate(256, 200)">
    <!-- Parte superior naranja -->
    <polygon points="0,-120 90,-70 0,-20 -90,-70" fill="#F4A261"/>
    <!-- Parte derecha azul oscuro -->
    <polygon points="90,-70 90,30 0,-20" fill="#1E3A8A"/>
    <!-- Parte inferior azul -->
    <polygon points="0,-20 90,30 0,80 -90,30" fill="#1E3A8A" opacity="0.85"/>
    <!-- Parte izquierda gris -->
    <polygon points="-90,-70 0,-20 0,80 -90,30" fill="#7A8DA0" opacity="0.7"/>
  </g>
  
  <!-- Texto TUBCOR -->
  <text x="256" y="390" font-family="Arial, sans-serif" font-size="76" font-weight="900" 
        text-anchor="middle" fill="#1E3A8A" letter-spacing="2">TUBCOR</text>
  
  <!-- Línea divisoria -->
  <line x1="100" y1="415" x2="412" y2="415" stroke="#1E3A8A" stroke-width="3"/>
  
  <!-- Subtexto -->
  <text x="256" y="455" font-family="Arial, sans-serif" font-size="22" font-weight="700" 
        text-anchor="middle" fill="#1E3A8A">Tubos de cartón</text>
</svg>